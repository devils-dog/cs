version: '3.8'

services:
  database:
    image: postgres:15
    environment:
      POSTGRES_DB: cs2_nades
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: database
      DB_USER: postgres
      DB_NAME: cs2_nades
      DB_PASSWORD: postgres
      DB_PORT: 5432
    ports:
      - "3000:3000"
    depends_on:
      - database

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: